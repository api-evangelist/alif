aid: alif
name: Alif
description: >-
  Alif Semiconductor is a Silicon Valley fabless semiconductor company building
  secure, ultra-low-power 32-bit microcontrollers and fusion processors for edge
  AI/ML. Its Ensemble, Ensemble Gen AI, and Balletto product families pair Arm
  Cortex-M and Cortex-A cores with dedicated Ethos-U55 neural processing units,
  hardware AI acceleration, wireless connectivity, and a multilayered security
  architecture so machine-learning and generative-AI workloads can run directly
  on battery-powered devices. Developer resources center on Zephyr-based SDKs,
  CMSIS device family packs, VS Code project templates, evaluation kits,
  datasheets, reference manuals, and the Conductor configuration tool rather than
  a hosted web API. The company is backed by Kleiner Perkins.
